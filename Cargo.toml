[package]
name = "web-server"
version = "3.0.0-prerelease.6"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Cli
clap = { version = "4.5.53", features = ["derive", "env"] }
ts-rs = "11.0.1"

# Async
tokio = { version = "1.47.1", features = ["net", "fs", "process"] }
futures = "0.3.31"
bytes = "1.12.0"
async-trait = "0.1.89"

# Http Server
actix-web = { version = "4.11.0", features = ["rustls-0_23"] }
rustls = { version = "0.23.40", default-features = false, features = [
    "std",
    "ring",
] }
actix-files = "0.6.6"
actix-ws = "0.4.0"
wtransport = { version = "0.7.2", default-features = false, features = ["ring"] }
rcgen = "0.14.10"
time = "0.3.47"

# Moonlight
# Make sure to keep the ubrn.config.yaml repo the same as this
moonlight-common = { git = "https://github.com/spacedouut/moonlight-common-rust.git", rev = "b7869b4ab43f03edeb7a3e594e5d0ae2fec24c33", features = [
    "tokio",
    "tokio-hyper",
    "rustcrypto",
    "stream-proto",
    "serde",
], default-features = false }

# WebRTC
webrtc = "0.21.0-rc.2"
rtc = "0.21.0-rc.2"

# Log
log = { version = "0.4.28", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.4"
tracing-actix-web = "0.7.21"
venator = "1.1.0"

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
pem = { version = "3.0.5", features = ["serde"] }

# Error
anyhow = "1.0.99"
thiserror = "2.0.16"

# Security / Password
sha2 = "0.10.9"

# Other
uuid = { version = "1.24.0" }
hex = { version = "0.4.3" }

# Allocator (musl's default malloc is slow on the per-packet paths). Not on Windows: mimalloc v3 doesn't build with cross's mingw headers.
[target.'cfg(not(windows))'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[lints.clippy]
too_many_arguments = "allow"
unwrap_used = "warn"
todo = "warn"

[patch.crates-io]
# Fork of 0.21.0-rc.2 whose driver drains queued SenderRtp events in a burst, so a
# frame's RTP packets get flushed together (GSO) instead of one loop round + sendto each.
webrtc = { git = "https://github.com/spacedouut/webrtc", rev = "23fb1ab8d6d0bee882f05fc139eaae9ef00d76c6" }
